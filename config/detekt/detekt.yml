# ===========================================
# Detekt 全体設定
# ===========================================
build:
  # 許容される違反数（0 = 1つでも違反でビルド失敗）
  maxIssues: 9999

config:
  # detekt.yml の文法チェック
  validation: true

# ===========================================
# 標準ルールセットの有効化
# —— Android / Kotlin プロジェクトで一般的な構成
# ===========================================
processors:
  active: true    # Detekt 内部で使われる統計処理など。通常 ON のまま。

style:
  active: false    # コードスタイル関連
naming:
  active: false    # メソッド名・クラス名などの命名規則
complexity:
  active: false   # 複雑度や入れ子の深さなど
formatting:
  active: false    # ktlint ベースのフォーマットルール
  android: false   # Android プロジェクト向けの追加ルール
androrm:
  AndrOrmEntityRefRule:
    active: true
